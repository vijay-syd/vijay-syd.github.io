<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background-color: #f9f9f9;
      color: #333;
    }

    h1 {
      color: #4a4adb;
    }

    p {
      line-height: 1.6;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: #4a4adb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #3636b0;
    }
  </style>
</head>
<body>

  <h1>Hello, World!</h1>
  <p>Welcome to my first webpage. This is a paragraph of text.</p>

  <div class="card">
    <h2>About Me</h2>
    <p>Hi! I am just getting started with web development. This is my test page hosted on GitHub Pages.</p>
    <button onclick="alert('Button clicked!')">Click Me</button>
  </div>

  <div class="card">
    <h2>My Links</h2>
    <p><a href="https://github.com">Visit my GitHub</a></p>
  </div>

</body>
</html>
